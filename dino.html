<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Khủng Long Mất Mạng</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #f7f7f7;
      font-family: Arial, sans-serif;
    }
    #game-container {
      position: relative;
      width: 600px;
      height: 200px;
      background-color: #fff;
      border-bottom: 2px solid #535353;
      overflow: hidden;
      border-radius: 4px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    #dino {
      position: absolute;
      bottom: 0;
      left: 50px;
      width: 40px;
      height: 40px;
      background-color: #535353;
      border-radius: 4px;
    }
    #cactus {
      position: absolute;
      bottom: 0;
      right: -20px;
      width: 20px;
      height: 40px;
      background-color: #2e7d32;
      border-radius: 3px;
    }
    .jump {
      animation: jump 0.5s cubic-bezier(0.1, 0.7, 0.1, 1);
    }
    @keyframes jump {
      0% { bottom: 0; }
      50% { bottom: 100px; }
      100% { bottom: 0; }
    }
    #score-board {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 16px;
      font-weight: bold;
      color: #535353;
    }
    #instructions {
      margin-top: 15px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="score-board">Điểm: <span id="score">0</span></div>
    <div id="dino"></div>
    <div id="cactus"></div>
  </div>
  <p id="instructions">Nhấn **Phím cách (Space)** hoặc **chạm vào màn hình** để nhảy!</p>

  <script>
    const dino = document.getElementById("dino");
    const cactus = document.getElementById("cactus");
    const scoreElement = document.getElementById("score");

    let score = 0;
    let isJumping = false;
    let isGameOver = false;
    let cactusPosition = 600;
    let gameSpeed = 5;

    // Lắng nghe sự kiện nhảy
    document.addEventListener("keydown", function (event) {
      if (event.code === "Space") {
        jump();
      }
    });

    document.addEventListener("touchstart", function () {
      jump();
    });

    function jump() {
      if (isJumping || isGameOver) return;
      isJumping = true;
      dino.classList.add("jump");
      setTimeout(() => {
        dino.classList.remove("jump");
        isJumping = false;
      }, 500);
    }

    // Vòng lặp chính của game
    function gameLoop() {
      if (isGameOver) return;

      // Di chuyển cây xương rồng
      cactusPosition -= gameSpeed;
      if (cactusPosition < -20) {
        cactusPosition = 600;
        score += 10;
        scoreElement.innerText = score;
        
        // Tăng tốc độ game theo thời gian
        if (score % 50 === 0) {
          gameSpeed += 0.5;
        }
      }
      cactus.style.left = cactusPosition + "px";

      // Kiểm tra va chạm
      const dinoBottom = parseInt(window.getComputedStyle(dino).getPropertyValue("bottom"));
      
      // Xương rồng đi vào vùng tọa độ của khủng long
      if (cactusPosition > 50 && cactusPosition < 90 && dinoBottom < 40) {
        isGameOver = true;
        alert("Game Over! Điểm của bạn: " + score + "\nNhấn OK để chơi lại.");
        location.reload();
      }

      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
